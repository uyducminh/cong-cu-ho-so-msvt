<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Hồ sơ nhật ký MSVT</title>
<style>
:root{
  --bg:#f6f7f4;--card:#ffffff;--fg:#1d2a1f;--muted:#5f6b62;--line:#dfe4dc;--soft:#eef3ec;
  --accent:#2e7d32;--accent-fg:#ffffff;--warn:#9a6700;--warn-bg:#fff6dd;--err:#b3261e;--err-bg:#fdecea;--ok-bg:#e8f5e9;
  --input:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121512;--card:#1b201c;--fg:#e4ebe3;--muted:#9aa79c;--line:#2f3830;--soft:#222a23;
  --accent:#66bb6a;--accent-fg:#0d1a0e;--warn:#f2c14e;--warn-bg:#2f2810;--err:#f28b82;--err-bg:#3a1d1b;--ok-bg:#1d2e1e;
  --input:#151915;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#121512;--card:#1b201c;--fg:#e4ebe3;--muted:#9aa79c;--line:#2f3830;--soft:#222a23;
  --accent:#66bb6a;--accent-fg:#0d1a0e;--warn:#f2c14e;--warn-bg:#2f2810;--err:#f28b82;--err-bg:#3a1d1b;--ok-bg:#1d2e1e;
  --input:#151915;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 12px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input[type=checkbox]{width:16px;height:16px}
label.f textarea{width:100%;margin-top:3px;resize:vertical}
.btn{font:inherit;font-weight:600;border-radius:7px;border:1px solid var(--line);background:var(--soft);color:var(--fg);padding:7px 12px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{background:var(--soft);text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.t td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td input,table.t td select{width:100%}
.miss,input.miss,select.miss{background:var(--err-bg)!important;border:2px solid var(--err)!important;color:var(--fg)}
input.miss::placeholder{color:var(--err);opacity:.8}
.opt,input.opt,select.opt{background:var(--warn-bg)!important;border-color:var(--warn)!important}
.msg{border-radius:8px;padding:8px 10px;margin:4px 0;font-size:13px}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.ok{background:var(--ok-bg);color:var(--accent)}
.msg.info{background:var(--ok-bg);color:inherit}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{background:var(--soft);border-radius:8px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-size:20px}
.del td{opacity:.45;text-decoration:line-through}
.hide{display:none!important}
.timeline{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.timeline span{background:var(--soft);border-left:4px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:12px}
ol.guide li{margin:0 0 6px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>

"use strict";
/* ============================================================ helpers */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/\s+/g, " ").trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 80) || "x";
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 3200); }
// dates as UTC day numbers
const DAY = 864e5;
const dn = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / DAY);
const todayDn = () => { const t = new Date(); return dn(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const pad = n => String(n).padStart(2, "0");
function fmt(n) { const d = new Date(n * DAY); return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`; }
function iso(n) { const d = new Date(n * DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function fromIso(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? dn(+m[1], +m[2], +m[3]) : null; }
function fromDMY(s) { const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(String(s || "").trim()); return m ? dn(+m[3], +m[2], +m[1]) : null; }
function yearOf(n) { return new Date(n * DAY).getUTCFullYear(); }
const monthOf = n => new Date(n * DAY).getUTCMonth() + 1;
function inMonths(spec, m) {
  const t = String(spec || "").trim(); if (!t) return true;
  return t.split(/[,;]+/).some(part => { const x = part.split("-").map(v => parseInt(v, 10)); if (x.length === 1) return x[0] === m; const [a, b] = x; return a <= b ? m >= a && m <= b : (m >= a || m <= b); });
}

function planIssues(r, cfg, plan, from, to) {
  const out = [];
  const miss = [];
  cfg.stages.forEach(s => { if (!s.cn) miss.push(`giai đoạn “${s.vn}”`); });
  cfg.tasks.forEach(t => { if (!t.cn) miss.push(`công việc “${t.vn}”`); });
  cfg.pests.forEach(v => { if (!v.cn) miss.push(`SVGH “${v.vn}”`); });
  if (miss.length) out.push(["warn", `Thiếu tiếng Trung: ${miss.slice(0, 5).join(", ")}${miss.length > 5 ? ` và ${miss.length - 5} mục khác` : ""}. Vào tab 2 bấm “Dịch các ô tiếng Trung còn trống”.`]);
  cfg.tasks.forEach(t => { if (!plan.stages.find(s => s.id === t.stage)) out.push(["err", `Công việc “${t.vn}” chưa chọn giai đoạn.`]); });

    if (p.phi === "" || p.phi == null) out.push(["err", `${p.ten}: chưa có thời gian cách ly (ngày) theo nhãn.`]);

  if (notChecked.length) out.push(["warn", `Chưa đánh dấu đã đối chiếu Danh mục thuốc BVTV được phép và nhãn (đăng ký trên sầu riêng, liều, cách ly, MRL Trung Quốc): ${notChecked.join(", ")}.`]);
  const np = plan.active.filter(e => e.noProd);
  if (np.length) out.push(["err", `${np.length} lần xử lý hóa học chưa chọn thuốc (kiểm tra bảng diễn biến SVGH hoặc thuốc mặc định của SVGH).`]);

  const phiBad = [];

    if (hv) phiBad.push(`${e.L.ma} ${fmt(e.d)} ${p.ten} (thu hoạch ${fmt(hv.d)}, cần ≥ ${phi} ngày)`);
  }
  if (phiBad.length) out.push(["err", `Phun thuốc quá gần ngày thu hoạch (theo nhãn và mức ngừng phun ${minPhi} ngày trước thu hoạch): ${phiBad.slice(0, 4).join("; ")}${phiBad.length > 4 ? ` và ${phiBad.length - 4} lần khác` : ""}.`]);
  // pest occurrences out of their usual months
  const offMonth = new Map();
  for (const e of plan.active) for (const { v } of e.pests) {
    if (v.thang && !inMonths(v.thang, monthOf(e.d))) { const k = v.vn; if (!offMonth.has(k)) offMonth.set(k, [v.thang, fmt(e.d), 0]); offMonth.get(k)[2]++; }
  }
  for (const [k, [m, d, n]] of offMonth) out.push(["warn", `${k} ghi nhận ngày ${d}${n > 1 ? ` (và ${n - 1} lần khác)` : ""}, ngoài thời kỳ thường xuất hiện (tháng ${m}). Kiểm tra lại thời điểm trong bảng diễn biến SVGH.`]);
  // chemical sprays while flowers are open
  const flowerSt = plan.stages.filter(s => s.hoa);
  const sprayFl = plan.active.filter(e => e.prods.some(x => isPesticide(x.p) && x.p.loai !== "sinhhoc") && flowerSt.some(s => e.d >= s.start && e.d <= s.end));
  if (sprayFl.length) out.push(["warn", `${sprayFl.length} lần phun thuốc hóa học trong giai đoạn hoa nở; nên tránh vì ảnh hưởng thụ phấn (VD: ${sprayFl[0].L.ma} ${fmt(sprayFl[0].d)}).`]);

  const kh = Array.isArray(cfg.khoang) ? cfg.khoang : [100, 140];

  }
  const close = plan.active.filter(e => e.tooClose);
  const sp = cfg.spacing;
  if (close.length) out.push(["warn", `${close.length} lần bón phân/phun thuốc chưa đủ giãn cách (thuốc–thuốc ${sp.thuoc} ngày, phân bón gốc ${sp.phan} ngày, phân bón lá ${sp.la} ngày, thuốc–phân bón lá ${sp.thuocLa} ngày), VD: ${close[0].L.ma} ${fmt(close[0].d)} ${close[0].vn}. Đây là các ngày sửa tay hoặc lần xử lý sâu bệnh, công cụ không tự dời được.`]);
  const moved = plan.active.filter(e => e.shifted);
  if (moved.length) out.push(["ok", `Đã tự dời ${moved.length} lần bón phân/phun theo lịch để đủ giãn cách giữa các lần sử dụng vật tư trên cùng lô.`]);
  if (!harvest.length) out.push(["warn", "Quy trình chưa có công việc loại “Thu hoạch”, không kiểm tra được thời gian cách ly."]);
  if (from < plan.sStart || to > plan.sEnd) out.push(["warn", `Khoảng ngày xuất vượt ra ngoài vụ (${fmt(plan.sStart)} – ${fmt(plan.sEnd)}); chỉ ghi các việc trong vụ.`]);
  const ex = plan.active.filter(e => e.d < plan.sStart || e.d > plan.sEnd);
  if (ex.length) out.push(["warn", `${ex.length} việc rơi ra ngoài thời gian vụ (do lệch ngày hoặc sửa ngày).`]);
  return out;

    const W = [0.8, 1.9, 2.8, 8.4, 1.6, 1.6];
    lots.forEach((l, i) => {

      const vis = new Map();
      for (const e of byLot(l.k)) {
        const key = e.d + "|" + e.person; if (!vis.has(key)) vis.set(key, { d: e.d, person: e.person, acts: [] });
        const a = vis.get(key).acts; if (!a.some(x => x[0] === e.vn)) a.push([e.vn, e.cn]);
      }
      const rows = [...vis.values()].sort((a, b) => a.d - b.d).map((v, k) => [String(k + 1), fmt(v.d), v.person, v.acts.flatMap(([a, b]) => [`• ${a}`, `  ${b}`]), "Có / 是", ""]);
      ch.push(rows.length ? tbl(H, rows, W, 8, [0, 1, 4]) : para("Không có lượt ra vào trong khoảng thời gian này / 本期间无出入记录", { s: 10, i: true }));
    });
    ch.push(...signatures(ctx));
    files.push([`05_Nhat_ky_ra_vao_vung_trong_${tag}.docx`, makeDoc(ctx, false, ch)]);
  }
  return { files, tag, count: ev.length };
}

async function saveFile(filename, blob) {

    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data: blob }); toast("Đã tải: " + filename); return; }
  } catch (e) {
    if (e && e.code === "declined") { toast("Đã hủy tải file."); return; }
    if (e && !["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(e.code)) { toast("Không tải được: " + (e.message || e.code)); return; }
  }
  const a = h("a", { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click(); a.remove();
}

async function translateMissing(cfg) {
  const items = [];
  const push = (obj, k, src) => { if (obj[src] && !obj[k]) items.push([obj, k, obj[src]]); };
  cfg.stages.forEach(s => push(s, "cn", "vn")); cfg.tasks.forEach(t => push(t, "cn", "vn"));
  cfg.pests.forEach(p => { push(p, "cn", "vn"); push(p, "viTriCn", "viTri"); push(p, "bpHoaCn", "bpHoa"); push(p, "bpTcCn", "bpTc"); });
  cfg.traps.forEach(t => { push(t, "cn", "vn"); push(t, "posCn", "pos"); });
  if (!cfg.monitor.cn) items.push([cfg.monitor, "cn", cfg.monitor.vn]);
  if (!items.length) { toast("Không còn ô tiếng Trung nào trống."); return; }
  const sample = window.claude?.use ? await window.claude.use("sample") : null;
  if (!sample) { toast("Chức năng dịch không dùng được ở đây; hãy điền tiếng Trung thủ công."); return; }
  const btn = $("#btnTr"); btn.disabled = true; btn.textContent = `Đang dịch ${items.length} ô…`;
  try {
    const src = items.map(x => x[2]);
    const out = await sample.json(`Dịch các cụm từ tiếng Việt sau sang tiếng Trung giản thể, dùng thuật ngữ nông nghiệp chuẩn cho cây sầu riêng (榴莲) và hồ sơ kiểm dịch thực vật. Giữ nguyên ký hiệu {P}, tên thương mại thuốc, tên khoa học và con số. Trả về đúng một mảng JSON gồm ${src.length} chuỗi theo đúng thứ tự, không giải thích.\n\n${JSON.stringify(src)}`, { modelTier: "default" });
    if (!Array.isArray(out) || out.length !== src.length) throw new Error("Kết quả dịch không khớp số dòng");
    items.forEach(([obj, k], i) => { obj[k] = String(out[i] || "").trim(); });
    persist("communes", UI.xa); toast(`Đã dịch ${items.length} ô. Hãy rà lại trước khi xuất.`); renderQuyTrinh();
  } catch (e) { toast("Không dịch được: " + (e.message || e.code)); btn.disabled = false; btn.textContent = "Dịch các ô tiếng Trung còn trống"; }
}

function currentSeasonYear(cfg) { const t = todayDn(), y = yearOf(t); return t >= seasonStartDn(cfg, y) ? y : y - 1; }
// simple typed date field dd-mm-yyyy
const dmy = n => n == null ? "" : fmt(n).replace(/\//g, "-");
function parseD(t) {
  const m = /^\s*(\d{1,2})[\/\-.\s](\d{1,2})[\/\-.\s](\d{2}|\d{4})\s*$/.exec(String(t || "")); if (!m) return null;
  const d = +m[1], mo = +m[2], y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const n = dn(y, mo, d); return monthOf(n) === mo ? n : null;
}
function dIn(n, w = 110) {
  const i = h("input", { type: "text", value: dmy(n), placeholder: "dd-mm-yyyy", inputmode: "numeric" }); i.style.width = w + "px";
  i.addEventListener("change", () => { if (i.value.trim() && parseD(i.value) == null) { toast("Ngày chưa đúng dạng dd-mm-yyyy, VD 25-08-2026"); } }, true);
  return i;
}

const FB_HEAD = ["ID", "Nông dân", "Số điện thoại", "Ngày", "Giai đoạn", "SVGH", "Biện pháp", "Loại phân thuốc", "Tên phân thuốc", "Hoạt chất", "Liều Lượng", "Cách ly", "Mã truy xuất", "Công việc", "Lô đất"];
const FB_SHEET = "Nhật ký canh tác";
const FB_BASE = {}; // region id -> parsed FarmBase export (kept for this session only)
const fbDate = n => dmy(n);
function fbParse(wb, fileName) {
  const ws = wb.Sheets[FB_SHEET]; if (!ws) throw new Error(`File không có sheet “${FB_SHEET}”. Hãy dùng file nhật ký canh tác xuất từ FarmBase (NKCT_….xlsx).`);
  const aoa = (s, raw = false) => wb.Sheets[s] ? XLSX.utils.sheet_to_json(wb.Sheets[s], { header: 1, raw, defval: "" }) : [];
  const main = aoa(FB_SHEET), head = main[0].map(x => String(x).trim());
  const miss = FB_HEAD.filter(c => !head.includes(c)); if (miss.length) throw new Error(`Sheet nhật ký thiếu cột: ${miss.join(", ")}.`);
  const rows = main.slice(1).filter(r => r.some(v => String(v).trim())).map(r => FB_HEAD.map(c => String(r[head.indexOf(c)] ?? "").trim()));
  const conf = aoa("Cấu hình").slice(1).filter(r => r[0]);
  const C = Object.fromEntries(conf.map(r => [String(r[0]).trim(), String(r[1] ?? "").trim()]));
  // merged cells: a farmer row may cover several lots, carry the name down
  let last = ["", ""]; const lots = aoa("Lô đất").slice(1).filter(r => r[2]).map(r => { if (String(r[0]).trim()) last = [String(r[0]).trim(), String(r[1]).trim()]; return { ten: last[0], sdt: last[1], ma: String(r[2]).trim(), dt: r[3] }; });
  const prods = aoa("Phân thuốc").slice(1).filter(r => r[1]).map(r => r.slice(0, 6).map(v => String(v ?? "").trim()));
  const codes = aoa("Mã truy xuất").slice(1).filter(r => r[0]).map(r => r.slice(0, 3).map(v => String(v ?? "").trim()));

// checks on how much of the season comes from real field data rather than the process template
const X0 = plan => plan.sStart;
function realIssues(r, cfg, plan, edits) {
  const out = [], n = plan.lots.length;
  const own = plan.lots.filter(l => l.own).length;
  if (n > 1 && own < n) out.push(["warn", `${n - own}/${n} lô chưa có ngày ra hoa hoặc thu hoạch riêng, đang theo lịch chung: các vườn sẽ có lịch gần giống nhau. Nhập ở mục “Ngày ra hoa, thu hoạch của từng lô”.`]);
  const pend = plan.active.filter(e => e.kind === "mon" && !e.entered && e.d >= X0(plan) && e.d <= Math.min(todayDn(), plan.sEnd));
  const pendLots = new Set(pend.map(e => e.lot));
  if (pendLots.size) out.push(["err", `${pendLots.size}/${n} lô còn ${pend.length} lần kiểm tra chưa nhập kết quả thực tế (sâu bệnh, số ruồi ở bẫy). Hồ sơ xuất ra sẽ in chữ BẢN NHÁP: các dòng sâu bệnh lúc đó chỉ là kế hoạch theo quy trình mẫu, không dùng để nộp. Nhập ở mục “Kết quả kiểm tra sâu bệnh thực tế của lô”.`]);
  const usedPest = new Map();
  for (const e of plan.active) for (const x of e.prods) if (isPesticide(x.p)) usedPest.set(x.p.id + "|" + x.p.ten, x.p);
  const generic = [...usedPest.values()].filter(p => /^thuốc chứa/i.test(p.ten)).map(p => p.ten);
  if (generic.length) out.push(["err", `Tên thuốc chưa phải tên thương phẩm: ${[...new Set(generic)].join(", ")}. Nhập tên trên nhãn hoặc hóa đơn ở mục “Vật tư thực tế của từng hộ” (hoặc sửa trong quy trình).`]);
  const noNd = [...usedPest.values()].filter(p => !(num(p.nd) > 0)).map(p => p.ten);
  if (noNd.length) out.push(["warn", `Chưa có nồng độ pha theo nhãn: ${[...new Set(noNd)].join(", ")}. Hồ sơ đang ghi “theo liều trên nhãn”; VietGAP yêu cầu ghi nồng độ và lượng dùng.`]);
  const noAge = plan.lots.filter(l => l.age == null).length;
  if (noAge) out.push(["warn", `${noAge} lô chưa có năm trồng, lượng phân và nước phun đang tính như cây ≥ 6 năm.`]);
  return out;
}

    h("p", {}, "Nhật ký canh tác là gốc: mỗi công việc, lần kiểm tra bẫy, đợt điều tra và lần phát hiện sinh vật gây hại là một dòng. Nhật ký sâu bệnh lấy các dòng có phát hiện; nhật ký phân thuốc lấy các dòng có vật tư; ISPM 6 lấy các lần kiểm tra bẫy và điều tra 5 điểm; nhật ký ra vào gom tất cả các dòng theo ngày và người. Vì vậy ngày, lô, người và vật tư luôn trùng nhau giữa các file."),
    h("p", { class: "muted" }, "Hồ sơ dùng font Times New Roman, chỉ ghi ngày (không ghi giờ), tọa độ bẫy lấy theo tọa độ GPS của lô.")));
}
$("#fileJson").addEventListener("change", async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.regions || !d.communes) throw new Error("Tệp không phải sao lưu của công cụ này.");
    if (!await ask(`Khôi phục ${Object.keys(d.regions).length} vùng trồng và ${Object.keys(d.communes).length} xã/phường? Dữ liệu trùng sẽ bị ghi đè.`)) return;
    for (const kind of ["regions", "communes", "edits"]) for (const [id, v] of Object.entries(d[kind] || {})) { S[kind][id] = v; persist(kind, id); }
    UI.rid = Object.keys(S.regions)[0]; toast("Đã khôi phục dữ liệu."); render();
  } catch (e) { toast(e.message); }
});

/* ============================================================ shell */
function render() {
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.t === UI.tab);
  for (const t of ["vung", "quytrinh", "xuat", "saoluu"]) $("#t-" + t).classList.toggle("hide", t !== UI.tab);
  ({ vung: renderVung, quytrinh: renderQuyTrinh, xuat: renderXuat, saoluu: renderSaoLuu })[UI.tab]();
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; UI.tab = b.dataset.t; render(); });
if (!window.XLSX || !window.docx || !window.JSZip) document.querySelector("main").prepend(h("div", { class: "msg err" }, "Không tải được thư viện xử lý file; hãy tải lại trang."));
render();
initStore();
</script>
</body>
